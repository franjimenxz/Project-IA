[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-mcp"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "email-validator==2.3.0",
    "sqlalchemy[asyncio]==2.0.43",
    "alembic==1.16.5",
    "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
quality = [
    "pytest==9.1.1",
    "ruff==0.16.5",
    "httpx==0.28.1",
    "mypy==2.3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = ["--import-mode=importlib"]
markers = ["integration: requires PostgreSQL", "contract: appointment capability contract suite", "security: tenant isolation and authz", "e2e: end-to-end slice suites", "resilience: crash, timeout, and concurrent failure suites"]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-mcp"
version = "0.0.0"
requires-python = ">=3.13"

[project.optional-dependencies]
quality = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

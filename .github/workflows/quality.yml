name: Quality

on:
  pull_request:

jobs:
  documentation-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality dependencies
        run: python -m pip install ".[quality]"
      - name: Validate documentation
        run: |
          python scripts/check_docs.py --all docs
          python scripts/check_traceability.py
          pytest tests/docs -v
          ruff check scripts tests/docs

  platform-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality dependencies
        run: python -m pip install ".[quality]"
      - name: Lint, typecheck, and unit tests
        run: |
          ruff check .
          mypy src
          pytest tests/unit tests/performance tests/evals/unit -v

  database-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ia_mcp_tests
          # The container is ephemeral and reachable only from this job, so
          # trust auth keeps every credential out of the repository.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      IA_MCP_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/ia_mcp_tests
    steps:
      - uses: actions/checkout@v4
        with:
          # The Core guard in tests/e2e/test_second_tenant.py reviews the commit
          # range that onboarded tenant-b, which a shallow clone cannot resolve.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality dependencies
        run: python -m pip install ".[quality]"
      - name: End-to-end, security, contract, integration and resilience tests
        # `-m "not resilience"` leaves the marked resilience suite to the
        # quality-evidence workflow, which records its JUnit evidence.
        run: |
          pytest tests/e2e tests/security tests/contract tests/integration \
            tests/resilience -m "not resilience" -v

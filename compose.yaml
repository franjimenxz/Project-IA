services:
  api:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - .:/app
    command:
      - sh
      - -c
      - pip install --no-cache-dir . fastapi==0.141.1 uvicorn==0.52.4 && python -m uvicorn ia_mcp.api.app:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen("http://127.0.0.1:8000/health/live")
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
